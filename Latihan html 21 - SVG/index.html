<!DOCTYPE html>
<html>
    <head>
        <title>Latihan SVG</title>

        <style>
            body {
                min-height: 1000px;
            }
            svg {
                display: block;
                margin: 20px;
                background-color: #7c7782;
                }
                .satu {
                    background-color: #a8b0b1;
                    width: 300px;
                    height: 300px;
                }
                .kotak1 {
                    width: 100px;
                    height: 100px;
                    fill: salmon;
                    x: 50;
                    y: 50;
                }
        </style>
    </head>

    <body>
        <svg class="satu" viewbox="50 50 300 300">
            <rect class="kotak1"/>
        </svg>

        <svg width="150" height="150">
            <rect width="100" height="100" fill="lightblue"/>
            <circle r="50" cx="50" cy="50" fill="salmon "></circle>
            <rect width="70" height="70" x="15" y="15"></rect>
        </svg>

        <svg>
            <path fill="none" stroke="black" d="M 60,10 L 110,90 H 10 L 60,10"></path>

            <path fill="none" stroke="black" d="m 170,10 l 50,80 h -100 l 50,-80"></path>
        </svg>

        <svg>
            <path fill="none" stroke="red" d="M 10,90 C 30,90 25,10 50,10 S 70,90 90,90"></path>
        </svg>
    </body>
</html>
