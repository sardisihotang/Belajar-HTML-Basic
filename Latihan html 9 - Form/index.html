<!DOCTYPE html>
<html>
   <head>
      <title>FORM</title>
   </head>
   <body>
      <form>
         Nama Depan    : <input type="text"><br>
         Nama Belakang : <input type="text"><br>
         Pasword       : <input type="password"><br>
         <h4>WNI : Radio button </h4>
         <input type="radio" value="ya"><label for="">Ya</label><br>
         <input type="radio" value="tidal"><label for="">Tidak</label><br>
         <h4>Musik Favorit: (Checkbox)</h4>
         <input type="Checkbox" name="Musik"
         value="Dangdut"><label for="Dangdut">Dangdut</label><br>
         <input type="Checkbox" name="Musik"
         value="DJ"><label for="DJ">DJ</label><br>

         <h4>Dropdown List</h4>
         <select name="Pekerjaan">
            <option value="Mahasiswa">Mahasiswa</option>
            <option value="Wirausaha">Wirausaha</option>
         </select>

         <h4>Upload file</h4>
         <input type="file" name="foto" value="upload_foto">
         <br>
         <br>
         <input type="button" name="Submit" value="submit">
      </form>
   </body>
</html>
