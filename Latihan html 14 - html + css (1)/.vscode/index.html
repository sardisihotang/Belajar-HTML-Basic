<!DOCTYPE html>

<html>
    <head>
        <title>Belajar CSS</title>

        <style type="text/css">
            h1{
                color:rgb(24, 20, 255);
            }
            p{
                font-family: Arial;
            }
            b{
                color:rgb(255, 0, 0);
            }
        </style>
    </head>

    <body>
        <h1>Hello World from CSS</h1>
        <p>
            Ini adalah percobaan pertama kita menggunakan <b>HTML</b> dengan <b>CSS</b>.
        </p>
    </body>
</html>
