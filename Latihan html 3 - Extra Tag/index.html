        <title>Tag Extra</title>

    <body>
        <h4>Singkatan</h4>
        <!-- abbreviatoion <abbr> -->
        <p>Ucup sekolah di <abbr
            title="Sekolah Dasar">SD</abbr> merdeka</p>

            <h4>Citation dan Defenisi</h4>

            di Jawa Barat, berlokasi di Selatan.</p>

            <p>Otong adalah seorang <del>jagoan</del> <ins>ksatria</ins> web programning</p>
